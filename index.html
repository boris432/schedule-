<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание 11 «Б»</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8e8e93;--sep:#e5e5ea;
  --seg:#e3e3e8;--thumb:#fff;--accent:#007aff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--sep:#38383a;
    --seg:#1c1c1e;--thumb:#636366;--accent:#0a84ff;
  }
}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--sep:#38383a;
  --seg:#1c1c1e;--thumb:#636366;--accent:#0a84ff;
}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin:8px 4px 14px}
.cls{font-size:13px;color:var(--sub);letter-spacing:.02em;text-transform:uppercase}
h1{font-size:34px;line-height:1.1;margin:2px 4px 2px;font-weight:700;letter-spacing:-.02em}
.sub{margin:0 4px 18px;color:var(--sub);font-size:15px}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;gap:2px;margin-bottom:18px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:13px;
  font-weight:500;padding:7px 0;border-radius:7px;cursor:pointer;transition:background .2s}
.seg button.on{background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.seg button.today:not(.on){color:var(--accent)}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;padding:13px 16px;gap:14px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:50px;right:0;height:1px;background:var(--sep)}
.n{width:26px;color:var(--sub);font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.name{flex:1;font-size:17px}
.room{color:var(--sub);font-size:15px;flex:none}
.empty{padding:36px 16px;text-align:center;color:var(--sub);font-size:17px}
.cap{margin:28px 6px 8px;color:var(--sub);font-size:13px;text-transform:uppercase;letter-spacing:.02em}
.foot{margin:14px 6px 0;color:var(--sub);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="cls">11 «Б»</span></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="seg" id="seg"></div>
  <div class="card" id="list"></div>
  <p class="foot" id="foot"></p>
  <p class="cap">Оформление</p>
  <div class="seg" id="theme"></div>
</div>
<script>
function getTheme(){try{return localStorage.getItem("theme")||"auto"}catch(e){return "auto"}}
function applyTheme(t){
  var r=document.documentElement;
  if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");
}
function renderTheme(){
  var box=document.getElementById("theme"),cur=getTheme();
  box.innerHTML="";
  [["auto","Авто"],["light","Светлая"],["dark","Тёмная"]].forEach(function(o){
    var b=document.createElement("button");
    b.textContent=o[1];
    if(o[0]===cur)b.className="on";
    b.onclick=function(){
      try{localStorage.setItem("theme",o[0])}catch(e){}
      applyTheme(o[0]);renderTheme();
    };
    box.appendChild(b);
  });
}
applyTheme(getTheme());
renderTheme();
var DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
var SHORT=["Пн","Вт","Ср","Чт","Пт"];
var S=[
 [["Математика","317"],["История","315"],["ДПО/ОМЗ","209/317"],["Обществоведение","315"],["Белорусский язык","307"],["Русская литература","317"],["Русский язык","317"]],
 [["Английский язык","315/108"],["Математика","310"],["Физкультура и здоровье","спортзал"],["Информатика","305/309"],["География","318"],["Биология","207"],["Классный час","207"]],
 [["Физкультура и здоровье","спортзал"],["История","315"],["Белорусский язык","317"],["Белорусская литература","317"],["Английский язык","214/315"],["Химия","209"],["Физика","307"]],
 [["Информационный час","207"],["Русская литература","317"],["Математика","317"],["УПК",""],["УПК",""],["УПК",""],["УПК",""],["УПК",""],["УПК",""]],
 [["Биология","207"],["Химия","209"],["Математика","311"],["Физкультура и здоровье","спортзал"],["Физика","307"],["Астрономия","307"]]
];
function minskDay(){
  try{
    var w=new Date().toLocaleString("en-US",{timeZone:"Europe/Minsk",weekday:"short"});
    return ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(w);
  }catch(e){return (new Date().getDay()+6)%7}
}
function plural(n){
  var a=n%100,b=n%10;
  if(a>=11&&a<=14)return n+" уроков";
  if(b===1)return n+" урок";
  if(b>=2&&b<=4)return n+" урока";
  return n+" уроков";
}
function group(l){
  var r=[];
  l.forEach(function(x,i){
    var p=r[r.length-1];
    if(p&&p[2]===x[0]&&p[3]===x[1])p[1]=i+1;else r.push([i+1,i+1,x[0],x[1]]);
  });
  return r;
}
var real=minskDay();
var sel=real<5?real:0;
function render(){
  var seg=document.getElementById("seg");
  seg.innerHTML="";
  SHORT.forEach(function(s,i){
    var b=document.createElement("button");
    b.textContent=s;
    if(i===sel)b.className="on";
    else if(i===real)b.className="today";
    b.onclick=function(){sel=i;render()};
    seg.appendChild(b);
  });
  var title=DAYS[sel],sub=S[sel].length?plural(S[sel].length):"Уроков нет";
  if(sel===real){title="Сегодня";sub=DAYS[sel]+" · "+sub}
  else if(sel===(real+1)%7){title="Завтра";sub=DAYS[sel]+" · "+sub}
  document.getElementById("title").textContent=title;
  document.getElementById("sub").textContent=sub;
  var list=document.getElementById("list");
  list.innerHTML="";
  if(!S[sel].length){var e=document.createElement("div");e.className="empty";e.textContent="Уроков нет";list.appendChild(e)}
  group(S[sel]).forEach(function(g){
    var row=document.createElement("div");row.className="row";
    var n=document.createElement("span");n.className="n";
    n.textContent=g[0]===g[1]?g[0]:g[0]+"–"+g[1];
    var nm=document.createElement("span");nm.className="name";nm.textContent=g[2];
    row.appendChild(n);row.appendChild(nm);
    if(g[3]){var r=document.createElement("span");r.className="room";r.textContent=g[3];row.appendChild(r)}
    list.appendChild(row);
  });
  document.getElementById("foot").textContent=real>4?"Сегодня выходной — показан понедельник":"";
}
function b64bytes(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  var bin=atob(s),a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return a;
}
function loadData(){
  var p=new URLSearchParams(location.search).get("d");
  if(!p||typeof DecompressionStream==="undefined")return Promise.resolve();
  var st=new Blob([b64bytes(p)]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Response(st).text().then(function(t){
    var d=JSON.parse(t);
    if(Array.isArray(d)&&d.length===5)S=d;
  });
}
loadData().catch(function(){}).then(function(){
  real=minskDay();sel=real<5?real:0;render();
});
</script>
</body>
</html>
